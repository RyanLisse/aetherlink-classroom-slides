<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" font-family="Nunito, Inter, -apple-system, 'Segoe UI', sans-serif">
  <!-- The tricky case in slow motion: the ↑ key, then the ← key, then the snake moves. Below: what a good game does, and what the test checks. -->
  <!-- Keys are always "the ↑ key"; directions are always words (up, left, right). -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3ddc84"/><stop offset="1" stop-color="#1fa862"/></linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#1a2547" stroke-width="1"/></pattern>
    <marker id="next" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#FF7A1A"/></marker>
    <marker id="flow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a6b8d2"/></marker>
    <g id="board">
      <rect x="0" y="78" width="300" height="140" rx="10" fill="#0a1128" stroke="#233c55" stroke-width="2"/>
      <rect x="0" y="78" width="300" height="140" fill="url(#grid)"/>
    </g>
  </defs>

  <text x="500" y="24" text-anchor="middle" font-size="15" font-weight="900" fill="#a6b8d2" letter-spacing="1">THE TRICKY CASE · THE SNAKE IS MOVING RIGHT · TWO KEYS, VERY FAST</text>

  <!-- 1: the up key -->
  <g transform="translate(20 0)">
    <text x="0" y="62" font-size="19" font-weight="900" fill="#e9f0fc">1  Press the <tspan fill="#FF7A1A">↑</tspan> key</text>
    <use href="#board"/>
    <g fill="url(#body)"><rect x="78" y="146" width="24" height="24" rx="7" opacity=".6"/><rect x="108" y="146" width="24" height="24" rx="7" opacity=".75"/><rect x="138" y="146" width="24" height="24" rx="7" opacity=".9"/></g>
    <rect x="167" y="145" width="26" height="26" rx="8" fill="#3ddc84"/><circle cx="186" cy="152" r="3" fill="#06111e"/><circle cx="186" cy="164" r="3" fill="#06111e"/>
    <path d="M180 140V104" stroke="#FF7A1A" stroke-width="3.5" stroke-dasharray="6 5" stroke-linecap="round" marker-end="url(#next)"/>
    <text x="16" y="104" font-size="15" font-weight="800" fill="#FF7A1A">next: up</text>
    <text x="0" y="244" font-size="16" font-weight="800" fill="#e9f0fc">The game notes: go up next.</text>
    <text x="0" y="265" font-size="14" font-weight="700" fill="#a6b8d2">The snake hasn't moved yet:</text>
    <text x="0" y="284" font-size="14" font-weight="700" fill="#a6b8d2">it moves once every 0.12 seconds.</text>
  </g>
  <path d="M328 148h18" stroke="#a6b8d2" stroke-width="3" stroke-linecap="round" marker-end="url(#flow)"/>

  <!-- 2: quickly the left key -->
  <g transform="translate(350 0)">
    <text x="0" y="62" font-size="19" font-weight="900" fill="#e9f0fc">2  Quickly the <tspan fill="#FF7A1A">←</tspan> key</text>
    <use href="#board"/>
    <g fill="url(#body)"><rect x="78" y="146" width="24" height="24" rx="7" opacity=".6"/><rect x="108" y="146" width="24" height="24" rx="7" opacity=".75"/><rect x="138" y="146" width="24" height="24" rx="7" opacity=".9"/></g>
    <rect x="167" y="145" width="26" height="26" rx="8" fill="#3ddc84"/><circle cx="186" cy="152" r="3" fill="#06111e"/><circle cx="186" cy="164" r="3" fill="#06111e"/>
    <path d="M180 140V104" stroke="#a6b8d2" stroke-width="3" stroke-dasharray="6 5" stroke-linecap="round" opacity=".35"/>
    <path d="M180 140C180 108 150 108 150 136" fill="none" stroke="#FF7A1A" stroke-width="3.5" stroke-dasharray="6 5" stroke-linecap="round" marker-end="url(#next)"/>
    <text x="16" y="104" font-size="15" font-weight="800" fill="#FF7A1A">next: left</text>
    <text x="0" y="244" font-size="16" font-weight="800" fill="#e9f0fc">A careless game compares</text>
    <text x="0" y="265" font-size="14" font-weight="700" fill="#a6b8d2">left with up, the key you just pressed.</text>
    <text x="0" y="284" font-size="14" font-weight="700" fill="#a6b8d2">Not straight back from up, so: OK.</text>
  </g>
  <path d="M658 148h18" stroke="#a6b8d2" stroke-width="3" stroke-linecap="round" marker-end="url(#flow)"/>

  <!-- 3: the snake moves -->
  <g transform="translate(680 0)">
    <text x="0" y="62" font-size="19" font-weight="900" fill="#e9f0fc">3  The snake moves</text>
    <rect x="0" y="78" width="300" height="140" rx="10" fill="#1d0f17" stroke="#ff5a5a" stroke-width="2.5"/>
    <rect x="0" y="78" width="300" height="140" fill="url(#grid)"/>
    <g fill="url(#body)"><rect x="78" y="146" width="24" height="24" rx="7" opacity=".6"/><rect x="108" y="146" width="24" height="24" rx="7" opacity=".75"/></g>
    <rect x="137" y="145" width="26" height="26" rx="8" fill="#3ddc84"/><circle cx="144" cy="152" r="3" fill="#06111e"/><circle cx="144" cy="164" r="3" fill="#06111e"/>
    <g stroke="#ff5a5a" stroke-width="4" stroke-linecap="round"><path d="M138 146l24 24M162 146l-24 24"/></g>
    <text x="150" y="116" text-anchor="middle" font-size="22" font-weight="900" fill="#ff5a5a" letter-spacing="2">GAME OVER</text>
    <text x="0" y="244" font-size="16" font-weight="800" fill="#e9f0fc">It goes left, into its own neck.</text>
    <text x="0" y="265" font-size="14" font-weight="700" fill="#a6b8d2">It was still moving right, so left</text>
    <text x="0" y="284" font-size="14" font-weight="700" fill="#a6b8d2">is straight back. From two quick keys.</text>
  </g>

  <!-- what a good game does -->
  <rect x="20" y="302" width="960" height="42" rx="10" fill="#0c1f18" stroke="#3ddc84" stroke-width="2"/>
  <text x="500" y="329" text-anchor="middle" font-size="16" font-weight="800" fill="#e9f0fc"><tspan fill="#3ddc84">✓ A good game</tspan> compares left with where the snake really moves: right. Straight back, so ignored.</text>

  <!-- what the test checks, and why -->
  <rect x="20" y="356" width="960" height="60" rx="10" fill="#1d1608" stroke="#ffb545" stroke-width="2"/>
  <text x="500" y="381" text-anchor="middle" font-size="16" font-weight="800" fill="#e9f0fc"><tspan fill="#ffb545">The test</tspan> presses the <tspan fill="#FF7A1A">↑</tspan> key and the <tspan fill="#FF7A1A">←</tspan> key for you, in a split second, and checks: no game over.</text>
  <text x="500" y="404" text-anchor="middle" font-size="14" font-weight="700" fill="#a6b8d2">Why? You'd almost never press that fast while playing. And a later change can break it without you noticing.</text>
</svg>
