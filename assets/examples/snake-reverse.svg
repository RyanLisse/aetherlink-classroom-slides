<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" font-family="Nunito, Inter, -apple-system, 'Segoe UI', sans-serif">
  <!-- The same two fast keys, two games: correct (turns up) and the bug (turns back into itself) -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3ddc84"/><stop offset="1" stop-color="#1fa862"/></linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#1a2547" stroke-width="1"/></pattern>
    <marker id="up" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3ddc84"/></marker>
    <marker id="back" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff5a5a"/></marker>
  </defs>

  <!-- the keys, in the middle: same input for both games -->
  <g text-anchor="middle">
    <text x="500" y="26" font-size="15" font-weight="900" fill="#a6b8d2" letter-spacing="1">MOVING RIGHT, YOU PRESS FAST</text>
    <rect x="452" y="40" width="40" height="40" rx="9" fill="#FF7A1A"/><text x="472" y="68" font-size="22" font-weight="900" fill="#fff">↑</text>
    <rect x="508" y="40" width="40" height="40" rx="9" fill="#FF7A1A"/><text x="528" y="68" font-size="22" font-weight="900" fill="#fff">←</text>
    <text x="500" y="100" font-size="13" font-weight="700" fill="#a6b8d2">both before the snake's next step</text>
  </g>

  <!-- left: correct -->
  <g transform="translate(20 0)">
    <text x="0" y="38" font-size="24" font-weight="900" fill="#3ddc84">✓ Correct</text>
    <rect x="0" y="120" width="420" height="180" rx="10" fill="#0a1128" stroke="#3ddc84" stroke-width="2.5"/>
    <rect x="0" y="120" width="420" height="180" fill="url(#grid)"/>
    <g fill="url(#body)">
      <rect x="123" y="213" width="24" height="24" rx="7" opacity=".6"/><rect x="153" y="213" width="24" height="24" rx="7" opacity=".75"/>
      <rect x="183" y="213" width="24" height="24" rx="7" opacity=".9"/><rect x="213" y="213" width="24" height="24" rx="7"/>
    </g>
    <rect x="212" y="182" width="26" height="26" rx="8" fill="#3ddc84"/>
    <circle cx="219" cy="190" r="3" fill="#06111e"/><circle cx="231" cy="190" r="3" fill="#06111e"/>
    <path d="M225 178V150" stroke="#3ddc84" stroke-width="4" stroke-linecap="round" marker-end="url(#up)"/>
    <text x="270" y="200" font-size="15" font-weight="800" fill="#e9f0fc">turns up,</text>
    <text x="270" y="220" font-size="15" font-weight="800" fill="#e9f0fc">← is ignored</text>
    <text x="0" y="330" font-size="17" font-weight="800" fill="#e9f0fc">The game keeps going.</text>
    <text x="0" y="354" font-size="14" font-weight="700" fill="#a6b8d2">It checks where the snake really went, not the last key.</text>
  </g>

  <!-- right: the bug -->
  <g transform="translate(560 0)">
    <text x="420" y="38" text-anchor="end" font-size="24" font-weight="900" fill="#ff5a5a">✗ The bug</text>
    <rect x="0" y="120" width="420" height="180" rx="10" fill="#0a1128" stroke="#ff5a5a" stroke-width="2.5"/>
    <rect x="0" y="120" width="420" height="180" fill="url(#grid)"/>
    <g fill="url(#body)">
      <rect x="123" y="213" width="24" height="24" rx="7" opacity=".6"/><rect x="153" y="213" width="24" height="24" rx="7" opacity=".75"/>
      <rect x="183" y="213" width="24" height="24" rx="7" opacity=".9"/>
    </g>
    <rect x="212" y="212" width="26" height="26" rx="8" fill="#3ddc84"/>
    <circle cx="218" cy="221" r="3" fill="#06111e"/><circle cx="218" cy="231" r="3" fill="#06111e"/>
    <path d="M230 205C230 182 200 182 198 205" fill="none" stroke="#ff5a5a" stroke-width="4" stroke-linecap="round" marker-end="url(#back)"/>
    <g stroke="#ff5a5a" stroke-width="4" stroke-linecap="round"><path d="M186 216l20 20M206 216l-20 20"/></g>
    <text x="270" y="200" font-size="15" font-weight="800" fill="#e9f0fc">turns back</text>
    <text x="270" y="220" font-size="15" font-weight="800" fill="#e9f0fc">into itself</text>
    <text x="210" y="160" text-anchor="middle" font-size="22" font-weight="900" fill="#ff5a5a" letter-spacing="2">GAME OVER</text>
    <text x="0" y="330" font-size="17" font-weight="800" fill="#e9f0fc">Game over, from two quick keys.</text>
    <text x="0" y="354" font-size="14" font-weight="700" fill="#a6b8d2">It listened to ← before the snake had moved up.</text>
  </g>

  <!-- why a test -->
  <rect x="20" y="372" width="960" height="1" fill="#233c55"/>
  <text x="500" y="396" text-anchor="middle" font-size="15" font-weight="800" fill="#ffb545">You'd almost never press that fast while playing. A test does it in one second, after every change.</text>
</svg>
