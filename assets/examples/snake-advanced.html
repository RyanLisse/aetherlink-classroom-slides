<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aether Snake · Level 4</title>
<style>
  html,body{margin:0;height:100%;background:#070b1c;color:#e9f0fc;font-family:Nunito,Inter,-apple-system,'Segoe UI',sans-serif;overflow:hidden}
  .wrap{height:100%;display:grid;grid-template-rows:auto 1fr auto;gap:8px;padding:10px 14px;box-sizing:border-box}
  .hud{display:flex;justify-content:space-between;align-items:baseline;font-weight:900;letter-spacing:.04em}
  .hud .lvl{color:#69e2f2}.hud .score{color:#ffb545}.hud .time{color:#c9a7ff}
  canvas{width:100%;height:100%;display:block;border-radius:10px;background:#0a1128;outline:2px solid #2a3a6b;cursor:pointer}
  .hint{text-align:center;font-size:13px;font-weight:800;color:#8fa0c8}
  .hint b{color:#3ddc84}
</style>
</head>
<body>
<div class="wrap">
  <div class="hud"><span class="lvl">LEVEL 4</span><span class="time" id="time">3:30</span><span class="score" id="score">Score 0</span></div>
  <canvas id="c" width="840" height="480" aria-label="Snake level 4: obstacles, more food, a longer and faster snake"></canvas>
  <div class="hint" id="hint"><b>Autopilot</b> · click the board and use the arrow keys to play yourself</div>
</div>
<script>
'use strict';
// Level 4 of the Day 2 build-up: more food, a longer start, more obstacles, faster, and a stopwatch.
const COLS = 28, ROWS = 16, START_LENGTH = 7, FOOD = 3, STEP_MS = 95, TIME_LIMIT = 210;
const OBSTACLES = [];
const wall = (x, y, w, h) => { for (let i = 0; i < w; i++) for (let j = 0; j < h; j++) OBSTACLES.push(x + i + ',' + (y + j)); };
wall(5, 3, 1, 5); wall(22, 8, 1, 5); wall(10, 12, 6, 1); wall(12, 3, 5, 1); wall(17, 7, 1, 3);
const blocked = new Set(OBSTACLES);
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const CW = cv.width / COLS, CH = cv.height / ROWS;
let snake, dir, nextDir, food, score, auto = true, over = false, left = TIME_LIMIT, lastTick = 0, lastSec = 0;

function reset() {
  snake = []; for (let i = 0; i < START_LENGTH; i++) snake.push({ x: 9 - i, y: 9 });
  dir = nextDir = { x: 1, y: 0 }; food = []; score = 0; over = false; left = TIME_LIMIT;
  while (food.length < FOOD) placeFood();
  document.getElementById('score').textContent = 'Score 0';
}
const key = p => p.x + ',' + p.y;
function free(p) { return p.x >= 0 && p.y >= 0 && p.x < COLS && p.y < ROWS && !blocked.has(key(p)) && !snake.some(s => s.x === p.x && s.y === p.y); }
function placeFood() {
  for (let t = 0; t < 500; t++) { const p = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
    if (free(p) && !food.some(f => f.x === p.x && f.y === p.y)) { food.push(p); return; } }
}
const DIRS = [{ x: 1, y: 0 }, { x: -1, y: 0 }, { x: 0, y: 1 }, { x: 0, y: -1 }];
function autopilot() {                               // breadth-first search to the nearest food
  const head = snake[0], body = new Set(snake.slice(0, -1).map(key)), seen = new Map([[key(head), null]]), q = [head];
  while (q.length) { const p = q.shift();
    if (seen.get(key(p)) && food.some(f => f.x === p.x && f.y === p.y)) { let k = key(p); while (seen.get(k).from !== key(head)) k = seen.get(k).from; return seen.get(k).d; }
    for (const d of DIRS) { const n = { x: p.x + d.x, y: p.y + d.y }, nk = key(n);
      if (n.x < 0 || n.y < 0 || n.x >= COLS || n.y >= ROWS || blocked.has(nk) || body.has(nk) || seen.has(nk)) continue;
      seen.set(nk, { from: key(p), d }); q.push(n); } }
  return DIRS.find(d => free({ x: head.x + d.x, y: head.y + d.y }) && !(d.x === -dir.x && d.y === -dir.y)) || dir;
}
function tick() {
  if (auto) nextDir = autopilot();
  if (!(nextDir.x === -dir.x && nextDir.y === -dir.y)) dir = nextDir;
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
  const tail = snake.pop();
  if (!free(head)) { snake.push(tail); return end(); }
  snake.unshift(head);
  const i = food.findIndex(f => f.x === head.x && f.y === head.y);
  if (i >= 0) { food.splice(i, 1); snake.push(tail); score++; placeFood(); document.getElementById('score').textContent = 'Score ' + score; }
}
function end() { over = true; setTimeout(() => { auto = true; hint(); reset(); }, 1800); }
function hint() { document.getElementById('hint').innerHTML = auto ? '<b>Autopilot</b> · click the board and use the arrow keys to play yourself' : '<b>You play</b> · arrow keys · click outside the game to go back to the slides'; }
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fill(); }
function draw() {
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.strokeStyle = '#1a2547'; ctx.lineWidth = 1;
  for (let x = 0; x <= COLS; x++) { ctx.beginPath(); ctx.moveTo(x * CW, 0); ctx.lineTo(x * CW, cv.height); ctx.stroke(); }
  for (let y = 0; y <= ROWS; y++) { ctx.beginPath(); ctx.moveTo(0, y * CH); ctx.lineTo(cv.width, y * CH); ctx.stroke(); }
  ctx.fillStyle = '#7b5cff'; OBSTACLES.forEach(k => { const [x, y] = k.split(',').map(Number); rr(x * CW + 2, y * CH + 2, CW - 4, CH - 4, 6); });
  food.forEach(f => { ctx.fillStyle = '#ff5a5a'; ctx.beginPath(); ctx.arc(f.x * CW + CW / 2, f.y * CH + CH / 2, CW * .32, 0, 7); ctx.fill(); });
  snake.forEach((s, i) => { ctx.globalAlpha = i ? Math.max(.45, 1 - i * .04) : 1; ctx.fillStyle = i ? '#1fa862' : '#3ddc84'; rr(s.x * CW + 2, s.y * CH + 2, CW - 4, CH - 4, 8); });
  ctx.globalAlpha = 1;
  if (over) { ctx.fillStyle = 'rgba(7,11,28,.6)'; ctx.fillRect(0, 0, cv.width, cv.height); ctx.fillStyle = '#ff5a5a'; ctx.font = '900 54px Nunito, sans-serif'; ctx.textAlign = 'center'; ctx.fillText('GAME OVER', cv.width / 2, cv.height / 2 + 18); }
}
function loop(t) {
  if (!over && t - lastTick > STEP_MS) { lastTick = t; tick(); }
  if (!over && t - lastSec > 1000) { lastSec = t; left = left > 0 ? left - 1 : TIME_LIMIT; const m = Math.floor(left / 60), s = String(left % 60).padStart(2, '0'); document.getElementById('time').textContent = m + ':' + s; }
  draw(); requestAnimationFrame(loop);
}
const KEYS = { ArrowRight: DIRS[0], ArrowLeft: DIRS[1], ArrowDown: DIRS[2], ArrowUp: DIRS[3] };
addEventListener('keydown', e => { const d = KEYS[e.key]; if (!d) return; e.preventDefault(); if (auto) { auto = false; hint(); } nextDir = d; });
cv.addEventListener('click', () => { window.focus(); if (auto) { auto = false; hint(); } });
reset(); requestAnimationFrame(loop);
</script>
</body>
</html>
