name: Day 3 and 4 browser checks
on:
  pull_request:
    paths:
      - 'day3-maarten*'
      - 'day4-maarten*'
      - 'workshop4*'
      - 'assets/day3-maarten-n8n/**'
      - '.github/workflows/classroom-days.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --package-lock=false playwright@1.64.0
      - run: npx --no-install playwright install --with-deps chromium
      - name: Check slides and capture exercises
        run: |
          python3 serve.py 8765 > /tmp/classroom-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent --output /dev/null http://127.0.0.1:8765/; then break; fi
            sleep 0.25
          done
          curl --fail --silent --output /dev/null http://127.0.0.1:8765/
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          import assert from 'node:assert/strict';
          import {mkdirSync} from 'node:fs';
          mkdirSync('classroom-evidence', {recursive:true});
          const browser=await chromium.launch();
          try {
            const page=await browser.newPage({viewport:{width:1440,height:1000},reducedMotion:'reduce'});
            const errors=[];
            page.on('pageerror', e=>errors.push(e.message));
            page.on('console', m=>{if(m.type()==='error')errors.push(m.text());});
            page.on('requestfailed', r=>errors.push(r.url()+': '+r.failure()?.errorText));
            page.on('response', r=>{if(r.status()>=400)errors.push(r.status()+' '+r.url());});
            for(const deck of ['day3-maarten-n8n','day4-maarten-n8n-to-claude','workshop4']) {
              await page.goto(`http://127.0.0.1:8765/${deck}.html`);
              await page.waitForFunction(()=>window.SLIDES?.length>0);
              const slides=await page.evaluate(()=>window.SLIDES.map(s=>({title:s.title,type:s.type,exercise:s.layout==='exercise',image:!!s.visual?.image})));
              for(let i=0;i<slides.length;i++) {
                await page.goto(`http://127.0.0.1:8765/${deck}.html#${i+1}`);
                const heading=page.locator('.heading h1, .asg-head h1').first();
                await heading.waitFor();
                assert.ok((await heading.textContent()).trim(), `Slide ${i+1} needs a title`);
                await page.evaluate(()=>document.fonts.ready);
                await page.waitForFunction(()=>[...document.images].every(i=>i.complete));
                assert.deepEqual(await page.locator('img').evaluateAll(imgs=>imgs.filter(i=>!i.naturalWidth).map(i=>i.src)),[]);
                await page.evaluate(()=>{let n=0;while(typeof window.__reveal==='function'&&n++<30&&window.__reveal()){} });
                if(deck==='workshop4'&&slides[i].type==='concept'&&i>0)assert.ok((await page.locator('.slide-main').innerText()).trim(), `Concept slide ${i+1} needs visible content`);
                await page.screenshot({path:`classroom-evidence/${deck}-${i+1}.png`,fullPage:true});
              }
            }
            assert.deepEqual(errors,[]);
          } finally {await browser.close();}
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: classroom-evidence
          path: classroom-evidence/
