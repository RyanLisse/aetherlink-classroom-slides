name: Classroom slide acceptance
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app.js'
      - 'styles.css'
      - 'workshop*.html'
      - 'workshop*-slides.js'
      - 'index.html'
      - 'presenter.html'
      - 'presenter.js'
      - 'sessions.js'
      - 'tools/sessions.test.mjs'
      - 'tools/anatomy/integration.test.mjs'
      - 'tools/workshop3-route.test.mjs'
      - 'tools/workshop3-orchestration.test.mjs'
      - 'tools/workshop4-context.test.mjs'
      - 'assets/workshop-*/**'
      - 'assets/day3-orchestration/n8n-triage-l3-orchestration.json'
      - '.github/workflows/anatomy-figures.yml'
permissions:
  contents: read
concurrency:
  group: classroom-slides-${{ github.ref }}
  cancel-in-progress: true
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test classroom decks and optional workflow
        run: node --test --test-concurrency=2 tools/anatomy/integration.test.mjs tools/sessions.test.mjs tools/workshop3-route.test.mjs tools/workshop3-orchestration.test.mjs tools/workshop4-context.test.mjs
      - name: Install remote browser checks
        id: browser-install
        run: |
          npm install --no-save --package-lock=false playwright@1.64.0
          npx --no-install playwright install --with-deps chromium
      - name: Check classroom, presenter, mobile, W5 diagrams and reduced motion
        if: ${{ !cancelled() && steps.browser-install.outcome == 'success' }}
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/classroom-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          import assert from 'node:assert/strict';
          import {mkdirSync} from 'node:fs';
          mkdirSync('classroom-evidence',{recursive:true});
          const browser=await chromium.launch();
          const errors=[];
          const slideOverflowState=()=>({width:innerWidth,scrollWidth:Math.max(document.documentElement.scrollWidth,document.body.scrollWidth),elements:[...document.querySelectorAll('body *')].map(el=>({tag:el.tagName,id:el.id,class:el.className,rect:el.getBoundingClientRect().toJSON()})).filter(item=>item.rect.width>0&&(item.rect.right>innerWidth+1||item.rect.left<-1))});
          try {
            const page=await browser.newPage({viewport:{width:1440,height:1100}});
            page.on('pageerror',error=>errors.push(error.message));
            await page.goto('http://127.0.0.1:8765/workshop5.html#1');
            const sessions=await page.evaluate(()=>window.CLASSROOM_SESSIONS);
            for(const session of sessions){
              await page.locator('#session-select').selectOption(session.id);
              await page.waitForURL(`**/${session.href}`);
              assert.equal(await page.locator('#session-select').inputValue(),session.id);
              assert.ok(await page.locator('.heading h1').textContent());
              await page.waitForTimeout(1200);
              await page.screenshot({path:`classroom-evidence/session-${session.id}-desktop.png`,fullPage:true});
              await page.setViewportSize({width:390,height:844});
              assert.ok(await page.locator('#session-select').isVisible());
              await page.screenshot({path:`classroom-evidence/session-${session.id}-mobile.png`,fullPage:true});
              const overflow=await page.evaluate(()=>({width:innerWidth,scrollWidth:Math.max(document.documentElement.scrollWidth,document.body.scrollWidth),elements:[...document.querySelectorAll('body *')].map(el=>({tag:el.tagName,id:el.id,class:el.className,rect:el.getBoundingClientRect().toJSON()})).filter(item=>item.rect.width>0&&(item.rect.right>innerWidth+1||item.rect.left<-1))}));
              assert.ok(overflow.scrollWidth<=overflow.width+1,`${session.id} mobile overflow: ${JSON.stringify(overflow)}`);
              await page.setViewportSize({width:1440,height:1100});
              const presenter=await browser.newPage();
              const name=session.deck==='index.html'?'presenter.html':session.deck.replace('.html','-presenter.html');
              await presenter.goto(`http://127.0.0.1:8765/${name}?i=${session.start-1}`);
              const preview=presenter.locator('#p-frame');await preview.waitFor();
              await presenter.frameLocator('#p-frame').locator('.heading h1').waitFor();
              await presenter.waitForTimeout(1200);
              assert.ok((await preview.getAttribute('src')).startsWith(session.deck+'?embed=1'));
              await presenter.screenshot({path:`classroom-evidence/session-${session.id}-presenter.png`,fullPage:true});
              await presenter.close();
            }
            await page.setViewportSize({width:390,height:844});
            await page.emulateMedia({reducedMotion:'reduce'});
            await page.goto('http://127.0.0.1:8765/workshop5.html#1');
            const diagrams=await page.evaluate(()=>window.SLIDES.flatMap((s,i)=>s.visual?.diagram?[{slide:i+1,id:s.visual.diagram.id,media:s.visual.media}]:[]));
            assert.deepEqual(diagrams.map(({id})=>id),['loop','mcp','hooks','eval']);
            for(const {slide,id,media} of diagrams){
              await page.setViewportSize({width:1440,height:900});
              await page.emulateMedia({reducedMotion:'no-preference'});
              await page.goto(`http://127.0.0.1:8765/workshop5.html#${slide}`);
              const svg=page.locator('svg.diagram'); await svg.waitFor();
              assert.ok(await svg.getAttribute('aria-label'),id);
              assert.equal(await page.locator('.diagram-missing').count(),0,id);
              if(media) await page.getByRole('button',{name:'Diagram',exact:true}).click();
              const before=await svg.locator('.dg-on').count();
              await svg.click();
              assert.ok(await svg.locator('.dg-on').count()>before,`${id} reveals the first step`);
              if(media){
                await page.getByRole('button',{name:'Video',exact:true}).click();
                const video=page.locator('.diagram-media video');
                await video.waitFor({state:'visible'});
                await page.waitForFunction(()=>document.querySelector('.diagram-media video')?.currentTime>0);
              }
              await page.screenshot({path:`classroom-evidence/w5-${id}-desktop.png`,fullPage:true});
              await page.goto(`http://127.0.0.1:8765/workshop5.html?embed=1#${slide}`);
              assert.equal(await page.locator('video').count(),0);
              if(media) assert.ok(await page.locator('.diagram-media img').evaluate(el=>el.complete&&el.naturalWidth>0));
              await page.screenshot({path:`classroom-evidence/w5-${id}-presenter.png`,fullPage:true});
              await page.setViewportSize({width:390,height:844});
              await page.emulateMedia({reducedMotion:'reduce'});
              await page.goto(`http://127.0.0.1:8765/workshop5.html#${slide}`);
              await page.locator('svg.diagram').waitFor({state:'attached'});
              assert.equal(await page.locator('video').count(),0,`${id}: reduced motion uses a still`);
              const overflow=await page.evaluate(slideOverflowState);
              assert.ok(overflow.scrollWidth<=overflow.width+1,`${id} mobile overflow: ${JSON.stringify(overflow)}`);
              await page.screenshot({path:`classroom-evidence/w5-${id}-mobile-reduced.png`,fullPage:true});
            }
            assert.deepEqual(errors,[]);
          } finally {await browser.close();}
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: classroom-slide-acceptance
          path: classroom-evidence/
