name: Test classroom decks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render-bree-demonstrations:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Install capture tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg ttyd
          go install github.com/charmbracelet/vhs@v0.10.0
          npm install --no-save --package-lock=false playwright@1.64.0
          npx --no-install playwright install --with-deps chromium
      - name: Render all Bree demonstrations
        run: node tools/render-day5-guide-videos.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: bree-demonstrations
          path: |
            assets/day5-daily-brief-teach/*-guide.mp4
            assets/day5-daily-brief-teach/manifest.json
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test classroom decks
        run: node --test --test-concurrency=2 tools/anatomy/bottleneck/model.test.mjs tools/anatomy/integration.test.mjs tools/day*-*.test.mjs tools/sessions.test.mjs
      - name: Prepare static site
        run: node tools/publish-site.mjs
      - name: Check publish boundary
        run: |
          test -f dist/index.html
          test -f dist/styles.css
          test ! -e dist/.git
          test ! -e dist/.omc
          test ! -e dist/tools
          test -z "$(find dist -mindepth 1 -maxdepth 1 ! -name assets ! -name styles.css ! -name '*.html' ! -name '*.js' -print -quit)"
          test -z "$(find dist/assets -type d \( -name node_modules -o -name tools -o -name vendor \) -print -quit)"
