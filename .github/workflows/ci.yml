name: Test classroom decks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test classroom decks
        run: node --test --test-concurrency=2 tools/anatomy/bottleneck/model.test.mjs tools/anatomy/integration.test.mjs tools/day*-*.test.mjs tools/sessions.test.mjs
      - name: Prepare static site
        run: node tools/publish-site.mjs
      - name: Check publish boundary
        run: |
          test -f dist/index.html
          test -f dist/styles.css
          test ! -e dist/.git
          test ! -e dist/.omc
          test ! -e dist/tools
          test -z "$(find dist -mindepth 1 -maxdepth 1 ! -name assets ! -name styles.css ! -name '*.html' ! -name '*.js' -print -quit)"
          test -z "$(find dist/assets -type d \( -name node_modules -o -name tools -o -name vendor \) -print -quit)"
